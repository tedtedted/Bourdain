spring:
  application:
    name: bourdain
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bourdain}
    username: ${SPRING_DATASOURCE_USERNAME:bourdain}
    password: ${SPRING_DATASOURCE_PASSWORD:bourdain}
    hikari:
      data-source-properties:
        # pgjdbc sends a batch of inserts as one multi-row statement. Set here
        # rather than on the URL so it survives SPRING_DATASOURCE_URL overrides.
        reWriteBatchedInserts: true
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # A sync page is 5,000 rows plus their violations; batch the writes
        # and group them by table so each batch is one statement shape.
        jdbc:
          batch_size: 1000
        order_inserts: true
        order_updates: true
  modulith:
    events:
      jdbc:
        # Modulith owns the event_publication table (CREATE IF NOT EXISTS at
        # startup) so its schema always matches the library version in use.
        schema-initialization:
          enabled: true
      republish-outstanding-events-on-restart: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

bourdain:
  socrata:
    base-url: https://data.cityofchicago.org
    # Optional; without a token Socrata may throttle. https://dev.socrata.com/docs/app-tokens
    app-token: ${SOCRATA_APP_TOKEN:}
    page-size: 5000
    connect-timeout: 5s
    read-timeout: 30s
    max-attempts: 3
    retry-backoff: 2s
    inspections-dataset: 4ijn-s7e5
    licenses-dataset: uupf-x98q
    # Food-related license types worth mirroring for relocation matching.
    license-descriptions:
      - Retail Food Establishment
      - Tavern
      - Consumption on Premises - Incidental Activity
      - Wholesale Food Establishment
      - Shared Kitchen User (Long Term)
      - Mobile Food License
  sync:
    # The city refreshes the dataset daily, but weekly mirroring is enough for
    # this app. Monday 06:30 Chicago time picks up the prior week's changes.
    cron: "0 30 6 * * MON"
    zone: America/Chicago
    on-startup: true
    # Re-read a small window because Socrata watermarks are not guaranteed to be
    # unique; idempotent upserts make the overlap safe.
    watermark-overlap: 5m
