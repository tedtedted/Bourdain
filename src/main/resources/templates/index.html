<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/page :: pageHead('Bourdain — Chicago food inspections')}"></th:block>
</head>
<body>
<header th:replace="~{fragments/page :: header}"></header>

<main>
    <section class="hero">
        <h1>Would you eat there?</h1>
        <p>Health inspection results for every licensed food business in Chicago.</p>
        <input type="search" name="q" placeholder='Search a name, address, or ZIP like "60614"'
               hx-get="/search" hx-trigger="input changed delay:300ms" hx-target="#search-results"
               autocomplete="off" autofocus>
        <div id="search-results"></div>
    </section>

    <section th:unless="${#lists.isEmpty(recentFailures)}">
        <h2>Recent failures</h2>
        <ul class="cards">
            <li th:each="f : ${recentFailures}">
                <a th:href="@{/establishments/{id}(id=${f.licenseNumber()})}" class="card">
                    <span class="card-title" th:text="${f.dbaName()}">Name</span>
                    <span class="card-sub">
                        <span class="badge badge-fail">Fail</span>
                        <time th:text="${f.inspectedOn()}">date</time>
                        · <span th:text="${f.violationCount()}">0</span> violations
                    </span>
                    <span class="card-detail" th:text="${f.headline()}">headline</span>
                </a>
            </li>
        </ul>
    </section>
</main>

<footer th:replace="~{fragments/page :: footer(${lastSyncText}, ${establishmentCount})}"></footer>
</body>
</html>
